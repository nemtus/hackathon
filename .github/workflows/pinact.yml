name: Pinact

on:
  pull_request:

permissions:
  contents: read

jobs:
  pinact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify GitHub Actions are pinned to full commit SHAs
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          # Check-only: fail CI if any action is unpinned or a version comment
          # does not match its SHA. Never modify files.
          fix: 'false'
          verify: 'true'
